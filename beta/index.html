<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173a4b">
<meta name="description" content="MatchPath secure customer, staff and admin MVP portal">
<title>MatchPath · Secure Portal (Beta)</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="../"><span class="brand-icon">M<span>↗</span></span><span>MatchPath<small>Career search, handled.</small></span></a>
    <div class="top-right"><span id="modeLabel" class="muted">Secure portal beta</span><button id="logoutBtn" class="btn ghost hidden" type="button">Sign out</button></div>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar hidden">
      <div id="signedInAs" class="account-box"></div>
      <nav id="mainNav" aria-label="Portal navigation"></nav>
      <div class="side-note">Your search. Your decisions.<span>All real records require an authenticated account.</span></div>
    </aside>
    <main id="content" class="main">
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="page"><section class="card" style="max-width:550px"><h1>Loading MatchPath…</h1></section></div>
    </main>
  </div>
</div>
<div id="dialog" class="overlay hidden" role="dialog" aria-modal="true" aria-label="MatchPath dialog"><div class="modal">
  <div class="modal-top"><h2 id="dialogTitle">Review</h2><button id="dialogClose" class="icon-btn" aria-label="Close dialog">×</button></div><div id="dialogBody"></div>
</div></div>
<script>
(function () {
  var startupTimer = setTimeout(function () {
    var page = document.getElementById('page');
    if (!page || !page.textContent.includes('Loading MatchPath')) return;
    page.innerHTML = '<section class="card" style="max-width:660px"><h1>MatchPath could not start</h1><p>The portal did not load its application code. Please refresh once or open this page in Safari. If the issue continues, contact support.</p><button class="btn" type="button" onclick="location.reload()">Retry loading</button></section>';
  }, 10000);
  window.addEventListener('error', function (event) {
    if (!event || !event.message) return;
    var page = document.getElementById('page');
    if (!page || !page.textContent.includes('Loading MatchPath')) return;
    clearTimeout(startupTimer);
    page.innerHTML = '<section class="card" style="max-width:660px"><h1>MatchPath failed to load</h1><p>There was an error starting the portal. Refresh this page or open it in Safari.</p><button class="btn" type="button" onclick="location.reload()">Retry loading</button></section>';
  });
}());
</script>
<script type="module" src="./app.js?v=20261024-11"></script>
</body></html>
